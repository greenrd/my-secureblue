---
name: my-secureblue
description: This is my personal OS image.
base-image: ghcr.io/secureblue/kinoite-main-hardened
image-version: latest
modules:
- type: files
  files:
  - source: system
    destination: /
- type: dnf
  install:
    packages:
    - bcvk
    - bpftrace
    - btop
    - cabal-install
    - cargo
    - chromedriver
    - conda
#    - doclifter
    - emacs
    - emacs-json-mode
    - emacs-magit
    - emacsclient
    - funionfs
    - ghc-Diff-devel
    - ghc-aeson-pretty-devel
    - ghc-concurrent-output-devel
    - ghc-constraints-devel
    - ghc-erf-devel
    - ghc-lifted-base-devel
    - ghc-megaparsec-devel
    - ghc-mmorph-devel
    - ghc-pretty-show-devel
    - ghc-resourcet-devel
    - ghc-silently-devel
    - ghc-unliftio-devel
    - git
    - gnome-boxes
    - happy
    - libyaml-devel
    - openssl-devel
    - podman-machine
    - python3-ramalama
    - rust
    - rust-src
    - rustfmt
    - stack
    - strace
- type: default-flatpaks
  configurations:
    - notify: true
      install:
        - com.vscodium.codium
        - dev.vencord.Vesktop
        - io.appflowy.AppFlowy
        - org.fedoraproject.MediaWriter
        - org.gimp.GIMP
        - org.kde.akregator
        - org.kde.gwenview
        - org.kde.kcalc
        - org.kde.okular
        - org.libreoffice.LibreOffice
        - org.mixxx.Mixxx
        - org.signal.Signal
        - org.telegram.desktop
        - org.zotero.Zotero
- type: signing
- type: yafti
- type: kargs
  kargs:
  - lockdown=integrity
- type: script
  scripts:
  - "install-little_shell_scripts.sh"
  - "install-lossless-cut.sh"
  - "install-sort-yaml-seqs.sh"
  - "patch-yafti-config.sh"
